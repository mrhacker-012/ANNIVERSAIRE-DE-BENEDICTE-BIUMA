<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bénédicte Biuma - Elenael Events Grand Prestige</title>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --paper-pink: #f48fb1;
            --paper-texture: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            --emerald: #013220;
        }

        body, html { margin: 0; padding: 0; height: 100%; background: #050505; font-family: 'Montserrat', sans-serif; overflow: hidden; perspective: 2000px; }

        /* --- AMBIANCE CINÉMATIQUE --- */
        .stage {
            position: fixed; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            z-index: 1; transition: transform 2s cubic-bezier(0.7, 0, 0.3, 1);
        }

        /* --- OISEAUX RÉALISTES EN LIGNE --- */
        .bird-system { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
        .bird {
            position: absolute; top: 50%; left: -100px;
            width: 40px; height: 40px;
            offset-path: path('M 0 200 C 300 0, 700 400, 1200 100');
            animation: fly-path 10s infinite linear;
        }
        .bird svg { fill: #d4a373; animation: wing-flap 0.5s infinite alternate ease-in-out; }
        
        @keyframes fly-path { 
            0% { offset-distance: 0%; transform: scale(0.3); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { offset-distance: 100%; transform: scale(1.5); opacity: 0; }
        }
        @keyframes wing-flap { 
            from { transform: rotateX(0deg); } to { transform: rotateX(70deg); } 
        }

        /* --- ENVELOPPE 3D RÉALISTE --- */
        .envelope-container {
            width: 320px; height: 450px;
            transform-style: preserve-3d;
            position: relative; cursor: pointer;
            transition: all 1.5s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .envelope-body {
            position: absolute; width: 100%; height: 100%;
            background-color: var(--paper-pink); background-image: var(--paper-texture);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Rabats réalistes (triangles croisés) */
        .flap {
            position: absolute; width: 0; height: 0;
            border-style: solid; z-index: 2;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
            transition: transform 1s ease;
        }
        .flap.top {
            border-width: 225px 160px 0 160px;
            border-color: #c2185b transparent transparent transparent;
            top: 0; transform-origin: top; z-index: 5;
        }
        .flap.left {
            border-width: 225px 0 225px 160px;
            border-color: transparent transparent transparent #ad1457;
            left: 0;
        }
        .flap.right {
            border-width: 225px 160px 225px 0;
            border-color: transparent #ad1457 transparent transparent;
            right: 0;
        }

        /* Sceau de cire Elenael */
        .wax-seal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateZ(10px);
            width: 120px; height: 120px;
            background: var(--gold); border-radius: 50%;
            border: 3px solid #fff; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.2);
        }
        .wax-seal span { font-family: 'Pinyon Script'; color: #000; font-size: 2.2rem; line-height: 1; }

        /* --- DÉZOOM CAMÉRA --- */
        .dezoom { transform: scale(0.1) translateZ(-2000px) rotateX(45deg); opacity: 0; }

        /* --- INTERFACE INVITATION (APRES DÉZOOM) --- */
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; display: none; justify-content: center; align-items: center;
            background: url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=2000') center/cover;
        }
        #ui-layer::before { content: ''; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); }

        .glass-card {
            position: relative; width: 90%; max-width: 400px;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2);
            padding: 40px 20px; text-align: center; color: white;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }
        .glass-card::after { content: ''; position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px; border: 1px solid; border-image: var(--gold) 1; }

        h2 { font-family: 'Pinyon Script', cursive; font-size: 4rem; color: var(--rose-gold); margin: 0; }
        .royal-title { font-family: 'Cinzel', serif; letter-spacing: 4px; color: #d4a373; font-weight: 700; margin-bottom: 20px; }

        /* Silhouettes */
        .silhouettes { display: flex; justify-content: space-around; margin: 30px 0; }
        .human { width: 90px; height: 180px; fill: #fff; filter: drop-shadow(0 0 10px #d4a373); }

        .btn-royal {
            background: var(--gold); border: none; padding: 15px 45px;
            font-family: 'Cinzel'; font-weight: bold; cursor: pointer; letter-spacing: 2px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-top: 20px;
        }

        /* Sablier Réel */
        .hourglass-box { display: flex; align-items: center; justify-content: center; margin: 20px 0; }
        .hg-svg { width: 40px; height: 40px; animation: flip 7s infinite ease-in-out; margin-right: 15px; }
        .sand { fill: #fcf6ba; }
        @keyframes flip { 0%, 85% { transform: rotate(0); } 95%, 100% { transform: rotate(180deg); } }

    </style>
</head>
<body>

    <div class="bird-system">
        <div class="bird" style="animation-delay: 0s;"><svg viewBox="0 0 24 24"><path d="M21 5l-9 4-9-4 9 14z"/></svg></div>
        <div class="bird" style="animation-delay: 1s;"><svg viewBox="0 0 24 24"><path d="M21 5l-9 4-9-4 9 14z"/></svg></div>
        <div class="bird" style="animation-delay: 2s;"><svg viewBox="0 0 24 24"><path d="M21 5l-9 4-9-4 9 14z"/></svg></div>
    </div>

    <div class="stage" id="stage">
        <div class="envelope-container" id="envelope" onclick="unfoldAll()">
            <div class="envelope-body"></div>
            <div class="flap top"></div>
            <div class="flap left"></div>
            <div class="flap right"></div>
            
            <div class="wax-seal">
                <span>Elenael</span>
                <span style="font-family:'Cinzel'; font-size:0.5rem; letter-spacing:3px;">EVENTS</span>
            </div>
            
            <p style="position:absolute; bottom:-60px; width:100%; text-align:center; color:#d4a373; font-family:'Cinzel'; letter-spacing:5px; font-size:0.7rem;">Ouvrir l'Odyssée</p>
        </div>
    </div>

    <!-- INTERFACE POST-ANIMATION -->
    <div id="ui-layer">
        <div class="glass-card">
            <div class="royal-title">Anniversaire Royal</div>
            <h2>Bonjour,</h2>
            <div id="guest" style="font-family:'Cinzel'; font-size:1.2rem; margin:10px 0; color:#d4a373;">Précieux Invité</div>

            <p style="font-size: 0.9rem; line-height: 1.6;">Bénédicte Biuma vous convie le <br><b>5 Septembre à 16:00 Précise</b>.</p>

            <div class="hourglass-box">
                <svg class="hg-svg" viewBox="0 0 24 24">
                    <path d="M6 2h12v2l-4 6 4 6v2H6v-2l4-6-4-6V2z" fill="none" stroke="white" stroke-width="1.2"/>
                    <path class="sand" d="M7 3h10l-3.5 5.25L7 3z" style="transform-origin:bottom; animation:sand-out 7s infinite linear;"/>
                    <path class="sand" d="M12 11.5l3.5 5.25H8.5L12 11.5z" style="transform-origin:bottom; animation:sand-in 7s infinite linear;"/>
                </svg>
                <span style="font-family:'Cinzel'; font-weight:bold;">PONCTUALITÉ SOUHAITÉE</span>
            </div>

            <div class="silhouettes">
                <svg class="human" viewBox="0 0 100 200"><path d="M50 15c6 0 11 5 11 11s-5 11-11 11-11-5-11-11 5-11 11-11zm-15 35c2 0 15-2 15-2s13 2 15 2l8 40-5 5-8-30h-20l-8 30-5-5 8-40zm5 45h20l15 100h-50l15-100z"/></svg>
                <svg class="human" viewBox="0 0 100 200"><path d="M50 15c6 0 11 5 11 11s-5 11-11 11-11-5-11-11 5-11 11-11zm-20 35h40l5 50-5 95h-30l-5-95 5-50z"/></svg>
            </div>
            
            <div style="font-family:'Cinzel'; margin-bottom:10px;">CHIC EN BLANC</div>
            
            <button class="btn-royal" onclick="window.open('https://wa.me/243819794118')">Confirmer ma présence</button>
            <p style="margin-top:30px; font-size:0.5rem; letter-spacing:5px; color:#888;">ELENAEL EVENTS</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        function unfoldAll() {
            const env = document.getElementById('envelope');
            const stage = document.getElementById('stage');
            const ui = document.getElementById('ui-layer');

            // 1. Dépliage et dézoom
            env.style.transform = "rotateX(180deg) scale(0.2) translateZ(-2000px)";
            env.style.opacity = "0";
            stage.style.transform = "scale(0.5) translateZ(-1000px)";
            
            // 2. Confettis
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.7 }, colors: ['#d4a373', '#ffffff', '#f48fb1'] });

            // 3. Apparition UI
            setTimeout(() => {
                stage.style.display = 'none';
                ui.style.display = 'flex';
                setTimeout(() => { ui.style.opacity = '1'; }, 100);
            }, 1800);
        }

        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('guest').innerText = urlParams.get('n') || "Précieux Invité";
    </script>
</body>
</html>
